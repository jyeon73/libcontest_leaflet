<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>지도 테스트</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; display: flex; }
    #map { height: 100vh; width: 65%; }
    #panel { width: 35%; height: 100vh; overflow: hidden; background: #f5f5f5; padding: 16px; box-sizing: border-box; }
    .card img { width: 100%; height: auto; border-radius: 4px; }
    .thumb-strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
    .thumb { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; cursor: pointer; flex-shrink: 0; border: 2px solid transparent; transition: transform 0.15s ease, border-color 0.15s ease; }
    .thumb:hover { transform: scale(1.05); border-color: #aaa; }
    .thumb.active { border-color: #d33; }
    .emblem-tooltip { background: none; border: none; box-shadow: none; font-size: 20px; }
    .emblem-tooltip::before { display: none; }
    .note-area { margin-top: 12px; padding-top: 12px; border-top: 1px solid #ddd; }
    .note-area textarea { width: 100%; box-sizing: border-box; resize: vertical; font-family: inherit; margin: 4px 0; }
    #noteStatus { color: green; font-size: 13px; margin-left: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="cardArea">
      <p>장소를 클릭하면 자료가 여기에 표시됩니다.</p>
    </div>
    <div id="chatbox">
      <div id="chatLog"></div>
      <input type="text" id="chatInput" placeholder="질문을 입력하세요" />
      <button id="chatSendBtn">전송</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
