<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>지도 테스트</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; display: flex; }
    #map { height: 100vh; width: 65%; }
    #panel { width: 35%; height: 100vh; overflow: hidden; background: #f5f5f5; padding: 16px; box-sizing: border-box; }
    .card img { width: 100%; height: auto; border-radius: 4px; }
    .emblem-tooltip {
  background: none;
  border: none;
  box-shadow: none;
  font-size: 20px;
}

.emblem-tooltip::before {
  display: none; /* 툴팁 말풍선 꼬리(화살표) 제거 */
}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
  <div id="cardArea">
    <p>장소를 클릭하면 자료가 여기에 표시됩니다.</p>
  </div>
  <div id="chatbox">
    <div id="chatLog"></div>
    <input type="text" id="chatInput" placeholder="질문을 입력하세요" />
    <button id="chatSendBtn">전송</button>
  </div>
</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
